[package]
name = "trade-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trade-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
hex = "0.4"
