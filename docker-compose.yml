services:
  db:
    image: postgres:latest
    restart: always
    profiles: [local]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dhan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./certs/server.key:/etc/ssl/private/server.key:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/server.crt
      -c ssl_key_file=/etc/ssl/private/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    profiles: [local]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
    restart: always
    profiles: [local]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@host.docker.internal:5432/dhan?sslmode=disable
      MINIO_ENDPOINT: host.docker.internal:9000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DHAN_BASE_URL: ${DHAN_BASE_URL:-https://api.dhan.co}
    depends_on:
      db:
        condition: service_healthy

  go:
    build: ./go
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      GO_PORT: 8080
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@host.docker.internal:5432/dhan?sslmode=require
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-dhan}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
